<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars & NFT Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col items-center p-4">

    <!-- Шапка профиля -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-4">
        <h1 class="text-xl font-bold text-yellow-500 mb-1">⭐ Telegram Stars Hub</h1>
        <p id="user-info" class="text-sm text-slate-400">Авторизация...</p>
        <div class="mt-3">
            <div class="bg-slate-800 px-4 py-3 rounded-xl flex justify-between items-center">
                <span class="text-xs text-slate-400">Баланс звёзд</span>
                <span id="stars-balance" class="text-xl font-bold text-yellow-400">0 ⭐</span>
            </div>
        </div>
    </div>

    <!-- Блок лутбокса -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col items-center text-center">
        <h2 class="text-lg font-semibold mb-2">Открыть кейс</h2>
        <p class="text-xs text-slate-400 mb-6">Выбивай звёзды или эксклюзивные NFT!</p>
        
        <div id="case-box" class="w-32 h-32 bg-slate-800 border-2 border-dashed border-yellow-500/50 rounded-2xl flex items-center justify-center text-3xl mb-6 shadow-inner transition-transform">
            🎁
        </div>

        <button onclick="openCase()" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-600 hover:to-amber-700 text-slate-950 font-bold rounded-xl shadow-lg transition active:scale-95">
            Открыть кейс (10 ⭐)
        </button>
    </div>

    <script>
        // Инициализация Supabase
        const SUPABASE_URL = "https://jbqeyufcyikvndrczzcy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qhFuAOkyGyIfVka4VQ_I-A_fodB92rk";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Данные пользователя Telegram
        const user = tg.initDataUnsafe?.user;
        const telegramId = user ? user.id : 999999999;
        const username = user ? (user.username || user.first_name) : "TestUser";

        let userProfile = null;

        async function initApp() {
            document.getElementById('user-info').innerText = `Привет, ${username}!`;

            // Проверяем наличие профиля в Supabase
            let { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('telegram_id', telegramId)
                .single();

            if (error || !data) {
                // Создаём нового игрока
                const { data: newData, error: insertError } = await supabase
                    .from('profiles')
                    .insert([{ telegram_id: telegramId, username: username, balance_stars: 50 }])
                    .select()
                    .single();

                if (!insertError) userProfile = newData;
            } else {
                userProfile = data;
            }

            updateUI();
        }

        function updateUI() {
            if (userProfile) {
                document.getElementById('stars-balance').innerText = `${userProfile.balance_stars} ⭐`;
            }
        }

        async function openCase() {
            if (!userProfile || userProfile.balance_stars < 10) {
                alert("Недостаточно звёзд на балансе!");
                return;
            }

            const box = document.getElementById('case-box');
            box.classList.add('animate-bounce');

            setTimeout(async () => {
                box.classList.remove('animate-bounce');
                
                // Списываем 10 звёзд
                userProfile.balance_stars -= 10;
                
                await supabase
                    .from('profiles')
                    .update({ balance_stars: userProfile.balance_stars })
                    .eq('telegram_id', telegramId);

                updateUI();
                alert("Кейс открыт! С баланса списано 10 ⭐.");
            }, 1000);
        }

        initApp();
    </script>
</body>
</html>
